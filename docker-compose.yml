services:
  postgres:
    image: postgres:17-alpine
    container_name: recycling-commerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recycling_commerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - recycling_commerce_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recycling_commerce"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  recycling_commerce_postgres_data:
