services:
  - type: web
    name: recycling-commerce-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: LOG_LEVEL
        value: INFO
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: recycling-commerce-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: recycling-commerce-db
    plan: free
